<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Space+Grotesk:wght@300;400;600;700&family=Oleo+Script&family=Bodoni+Moda:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const header = document.querySelector("header");
  const scrollArrow = document.querySelector('.scroll-arrow');
  const navbarNav = document.getElementById('navbarNav');
  const video = document.getElementById('bg-video');
  
  if (video) {
    video.muted = true;
    video.defaultMuted = true;
    video.controls = false;                  // <- add this line
    video.removeAttribute('controls');       // <- and this line
  }

  window.addEventListener("scroll", function () {
    if (window.scrollY > 50) {
      header.classList.add("scrolled");
    } else {
      header.classList.remove("scrolled");
    }

    if (window.scrollY > 80) {
      scrollArrow.classList.add('hidden');
    } else {
      scrollArrow.classList.remove('hidden');
    }
  });

  navbarNav.addEventListener('shown.bs.collapse', function () {
    header.classList.add('menu-open');
  });

  navbarNav.addEventListener('hidden.bs.collapse', function () {
    header.classList.remove('menu-open');
  });
});
</script>

<body class="page-home">

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark text-white">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"> 
          <span class="navbar-toggler-icon"></span>
        </button>  
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ "/" | relative_url }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/profile/' %}active{% endif %}" href="{{ "/profile/" | relative_url }}">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/projects/' %}active{% endif %}" href="{{ "/projects/" | relative_url }}">Portfolio </a>
            </li> 
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/contact/' %}active{% endif %}" href="{{ "/contact/" | relative_url }}">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>


<section class="hero">

  <div class="hero-split">
    s<video id="bg-video"
       autoplay muted loop playsinline webkit-playsinline
       preload="metadata"
       disablepictureinpicture
       disableremoteplayback
       x-webkit-airplay="deny"
       controlslist="nodownload nofullscreen noremoteplayback"
       poster="{{ "/assets/images/hero-poster.jpg" | relative_url }}">
  <source src="{{ "/assets/videos/walk14.mp4" | relative_url }}" type="video/mp4">
</video>

      <div class="hero-content">
        {{ content }}
      </div>

      <div class="scroll-arrow">
        <i class="bi bi-chevron-down"></i>
      </div>
    </div>

    <!-- DIVIDER LINE -->
    <div class="hero-divider" aria-hidden="true"></div>

    <!-- RIGHT: single photo (swap the filename) -->
    <div class="hero-photo-panel">
      <img src="{{ "/assets/images/MMP_1016.jpg" | relative_url }}" alt="Gregory Sharma" class="hero-main-photo">
    </div>

  </div>

  <section class="page-banners">
  <a href="{{ "/profile/" | relative_url }}" class="banner-card">
    <div class="banner-inner">
      <span class="banner-label">Profile</span>
    </div>
  </a>
  <a href="{{ "/projects/" | relative_url }}" class="banner-card">
    <div class="banner-inner">
      <span class="banner-label">Portfolio</span>
    </div>
  </a>
  <a href="{{ "/contact/" | relative_url }}" class="banner-card">
    <div class="banner-inner">
      <span class="banner-label">Contact</span>
    </div>
  </a>
</section>


<footer class="footer navbar-dark text-white" id="site-footer">
  <div class="container footer-inner">
    <span class="footer-copyright">&copy; 2026 {{ site.name }}</span>
    <div class="footer-contact">
<span class="footer-contact-arrow">➤ </span>
      <a href="mailto:sharma.gregory@gmail.com">sharma.gregory@gmail.com</a>
      <span>+1 (518) 309-8489</span>
    </div>
  </div>
</footer>

</section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
